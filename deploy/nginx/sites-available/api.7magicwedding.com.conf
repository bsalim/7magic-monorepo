# API — 7magic-api.service (gunicorn + uvicorn workers) on 127.0.0.1:8003.
# Install to /etc/nginx/sites-available/, then symlink into sites-enabled/.

server {
    listen      80;
    listen      [::]:80;
    server_name api.7magicwedding.com;

    return      301 https://$host$request_uri;
}

server {
    listen              443 ssl;
    listen              [::]:443 ssl;
    http2               on;
    server_name         api.7magicwedding.com;

    ssl_certificate     /etc/ssl/cloudflare/7magicwedding.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/7magicwedding.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Authenticated Origin Pulls: see the apex config.
    # ssl_client_certificate /etc/ssl/cloudflare/origin-pull-ca.pem;
    # ssl_verify_client on;

    include /etc/nginx/snippets/cloudflare-realip.conf;

    add_header X-Robots-Tag           "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;

    gzip            on;
    gzip_vary       on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied    any;
    # JSON is nearly all this host returns.
    gzip_types      application/json application/problem+json text/plain;

    # Venue and article photo uploads land here. venue_upload_max_bytes is
    # 10 MiB, so the proxy must pass at least that or the API's own error
    # message is replaced by an nginx 413 the client cannot interpret.
    client_max_body_size 12m;

    access_log /var/log/nginx/7magic-api.access.log;
    error_log  /var/log/nginx/7magic-api.error.log;

    # Server level, so the location inherits it. Setting this next to the
    # include inside location / instead would be a duplicate of the shared
    # snippet and nginx would refuse to start.
    #
    # An upload of several MiB over a slow link must not be cut off at the 60s
    # default. gunicorn runs with --timeout 60 and will end the request itself
    # if the worker genuinely stalls.
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    location / {
        proxy_pass http://127.0.0.1:8003;
        include    /etc/nginx/snippets/7magic-proxy.conf;
    }
}
