# Public website — 7magic-web.service on 127.0.0.1:6273.
# Install to /etc/nginx/sites-available/, then symlink into sites-enabled/.
#
# Cloudflare terminates TLS for the browser; this cert only secures the
# Cloudflare -> origin hop. A Cloudflare Origin Certificate is the right one to
# use here (free, long-lived, trusted by Cloudflare only). SSL/TLS mode must be
# Full (strict) — see deploy/nginx/README.md.

# Cloudflare connects on 443 in Full modes, so :80 is only reached by traffic
# that bypassed the proxy. Redirect it rather than serving anything.
server {
    listen      80;
    listen      [::]:80;
    server_name 7magicwedding.com www.7magicwedding.com;
    return      301 https://7magicwedding.com$request_uri;
}

# www -> apex. Caddy served both hostnames from one block, but that does not
# carry over: ORIGIN in apps/web/.env is pinned to https://7magicwedding.com,
# and adapter-node rejects a POST whose Origin does not match it. Served on
# www, every form on the site would fail its CSRF check.
server {
    listen              443 ssl;
    listen              [::]:443 ssl;
    http2               on;
    server_name         www.7magicwedding.com;

    ssl_certificate     /etc/ssl/cloudflare/7magicwedding.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/7magicwedding.com.key;

    return 301 https://7magicwedding.com$request_uri;
}

server {
    listen              443 ssl;
    listen              [::]:443 ssl;
    http2               on;
    server_name         7magicwedding.com;

    ssl_certificate     /etc/ssl/cloudflare/7magicwedding.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/7magicwedding.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Authenticated Origin Pulls: proves the request really came from
    # Cloudflare, so nobody can reach the origin directly by pointing an A
    # record at its IP. Enable in the Cloudflare dashboard, then uncomment.
    # ssl_client_certificate /etc/ssl/cloudflare/origin-pull-ca.pem;
    # ssl_verify_client on;

    include /etc/nginx/snippets/cloudflare-realip.conf;

    # Leave HSTS to Cloudflare (SSL/TLS -> Edge Certificates -> HSTS). Setting
    # it here as well is harmless but easy to forget about when it is cached
    # in browsers for a year.

    # Cloudflare already compresses to the browser; this only covers the
    # Cloudflare -> origin hop, which is worth it on SSR HTML.
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_proxied      any;
    # application/xml is listed separately from application/xml+rss: nginx
    # matches these exactly, and /sitemap.xml is served as application/xml. Left
    # out it goes over the wire at ~330 KB instead of ~18 KB on every crawl.
    gzip_types        text/plain text/css text/xml application/xml application/json
                      application/javascript application/xml+rss
                      image/svg+xml application/manifest+json;

    # Contact and consultation forms post JSON only; venue photo uploads go to
    # the API host, not here.
    client_max_body_size 2m;

    # Server level so locations inherit it; the shared snippet no longer
    # sets these, to leave room for per-site overrides.
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    access_log /var/log/nginx/7magic-web.access.log;
    error_log  /var/log/nginx/7magic-web.error.log;

    # SvelteKit fingerprints everything under /_app/immutable, so the filename
    # changes whenever the content does and this can be cached indefinitely.
    location /_app/immutable/ {
        proxy_pass http://127.0.0.1:6273;
        include    /etc/nginx/snippets/7magic-proxy.conf;

        # `always` so the header survives 304s, which is most of these hits.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:6273;
        include    /etc/nginx/snippets/7magic-proxy.conf;
    }
}
