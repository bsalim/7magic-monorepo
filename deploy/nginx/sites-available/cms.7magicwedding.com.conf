# CMS admin — 7magic-cms.service on 127.0.0.1:6173.
# Install to /etc/nginx/sites-available/, then symlink into sites-enabled/.

server {
    listen      80;
    listen      [::]:80;
    server_name cms.7magicwedding.com;

    return      301 https://$host$request_uri;
}

server {
    listen              443 ssl;
    listen              [::]:443 ssl;
    http2               on;
    server_name         cms.7magicwedding.com;

    ssl_certificate     /etc/ssl/cloudflare/7magicwedding.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/7magicwedding.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Authenticated Origin Pulls: see the apex config.
    # ssl_client_certificate /etc/ssl/cloudflare/origin-pull-ca.pem;
    # ssl_verify_client on;

    include /etc/nginx/snippets/cloudflare-realip.conf;

    # The admin surface must never be indexed. `always` so it is still sent on
    # the 302 that bounces anonymous visitors to /login.
    add_header X-Robots-Tag        "noindex, nofollow" always;
    add_header X-Frame-Options     "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;

    gzip            on;
    gzip_vary       on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_types      text/plain text/css text/xml application/json
                    application/javascript application/xml+rss image/svg+xml;

    # Showcase and venue images are uploaded through the CMS, which forwards
    # them to the API. The API caps a file at 10 MiB
    # (venue_upload_max_bytes), so anything under that must survive this hop —
    # nginx's 1m default would 413 the request before the app ever sees it.
    # The headroom covers multipart encoding overhead.
    client_max_body_size 12m;

    # Server level so locations inherit it; the shared snippet no longer
    # sets these, to leave room for per-site overrides.
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    access_log /var/log/nginx/7magic-cms.access.log;
    error_log  /var/log/nginx/7magic-cms.error.log;

    location /_app/immutable/ {
        proxy_pass http://127.0.0.1:6173;
        include    /etc/nginx/snippets/7magic-proxy.conf;

        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:6173;
        include    /etc/nginx/snippets/7magic-proxy.conf;
    }
}
