# Shared proxy settings for all three 7Magic services.
# Install to /etc/nginx/snippets/7magic-proxy.conf.
#
# The header names here are not arbitrary: they must match PROTOCOL_HEADER,
# HOST_HEADER and ADDRESS_HEADER in deploy/env/{web,cms}.env.example, or
# adapter-node falls back to the loopback address and http:// and every
# generated URL and client IP is wrong.

proxy_http_version 1.1;
# Empty Connection header (not "upgrade") keeps the upstream connection alive.
# These services speak no WebSocket, so nothing needs upgrading.
proxy_set_header Connection "";

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
# XFF_DEPTH=1 in the app env means it reads the last entry, which is the address
# nginx appends here. Nginx is the only ingress, so that entry is trustworthy.
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;

proxy_connect_timeout 5s;

# Deliberately NO proxy_read_timeout / proxy_send_timeout here. nginx rejects a
# duplicate directive in the same context, so a site that needs a longer window
# than the shared default could not simply override it next to this include —
# it fails at startup with "directive is duplicate". Each site sets its own at
# server level instead, and the locations inherit it.

# SvelteKit streams SSR responses; buffering them adds latency for no gain.
proxy_buffering off;
