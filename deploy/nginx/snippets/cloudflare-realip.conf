# Restore the real client IP when Cloudflare is in front.
# Install to /etc/nginx/snippets/cloudflare-realip.conf and include it inside
# every server block that Cloudflare proxies.
#
# Without this, $remote_addr is a Cloudflare edge address: rate limits key on
# the wrong thing, access logs are useless, and the X-Forwarded-For that nginx
# passes upstream ends in a Cloudflare IP rather than the visitor's.
#
# THIS LIST GOES STALE. Cloudflare adds ranges. Regenerate with:
#
#   { curl -s https://www.cloudflare.com/ips-v4; echo; \
#     curl -s https://www.cloudflare.com/ips-v6; } \
#   | sed 's/^/set_real_ip_from /; s/$/;/' \
#   | sudo tee /etc/nginx/snippets/cloudflare-realip-ranges.conf
#
# and reload nginx. Worth putting on a monthly timer.

set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;

set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

# Cloudflare puts the true client in CF-Connecting-IP. Prefer it over
# X-Forwarded-For, which a client can forge and Cloudflare only appends to.
real_ip_header CF-Connecting-IP;
