[project]
name = "7magic-api"
version = "0.0.0"
description = "FastAPI backend for 7magic"
requires-python = ">=3.12"
dependencies = [
  "aiosqlite>=0.21.0",
  "alembic>=1.16.1",
  "argon2-cffi>=25.1.0",
  "asyncpg>=0.30.0",
  "boto3>=1.43.20",
  "fastapi>=0.136.1",
  "greenlet>=3.2.0",
  "gunicorn>=26.0.0",
  "pillow>=12.3.0",
  "pydantic-settings>=2.7.0",
  "python-multipart>=0.0.30",
  "sqlalchemy>=2.0.41",
  "uvicorn-worker>=0.4.0",
  "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
dev = [
  "httpx>=0.28.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
