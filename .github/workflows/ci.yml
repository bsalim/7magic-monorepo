name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  web-cms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Reads the pnpm version from packageManager in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Build before check: the Paraglide vite plugin generates the gitignored
      # src/lib/paraglide/ during the build, and svelte-check imports from it.
      - run: pnpm build
      - run: pnpm check
      - run: pnpm --filter @7magic/web test

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest

  deploy:
    needs: [web-cms, api]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Two pushes in quick succession queue rather than overlap; never cancel a
    # release that has already started.
    concurrency:
      group: production
      cancel-in-progress: false
    environment:
      name: production
      url: https://7magicwedding.com
    steps:
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy ~/.ssh/known_hosts
      # The key's authorized_keys entry forces deploy/release.sh on the server,
      # so no command is sent from here; whatever we asked for would be ignored.
      - name: Release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/deploy -p "$DEPLOY_PORT" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            "$DEPLOY_USER@$DEPLOY_HOST"
